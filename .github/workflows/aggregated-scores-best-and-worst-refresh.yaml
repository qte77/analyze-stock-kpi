---
# Weekly refresh of the aggregated-scores-best-and-worst universe preset.
#
# Sundays at 02:00 UTC (staggers before federal-contractors at 04:00 and
# demo-snapshot at 06:15). Pulls every non-meta universe's latest demo
# snapshot from the `data` branch, runs the orchestrator via
# scripts/build_aggregated_scores_best_and_worst.py, commits the audit
# JSON to the `data` branch via the verified REST Git Data API pattern,
# and opens a PR against `main` via the gh CLI IFF the preset diff is
# non-empty. Mirrors federal-contractors-refresh.yaml.
#
# The orchestrator's source universes (qte77-watchlist, sp500, eurostoxx,
# federal-contractors, japan, south-america, south-korea) are hardcoded
# in the build script; this workflow only needs to make their snapshot
# files available in the workspace.

name: aggregated-scores-best-and-worst-refresh

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aggregated-scores-best-and-worst-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: rebuild preset + commit audit + open preset PR
    runs-on: ubuntu-latest
    steps:
      # Check out the dispatched ref (cron + dispatch-without-input both
      # default to the workflow home branch = main). Explicit
      # `gh workflow run --ref feat/foo` lets feature-branch changes test
      # against real `data`-branch snapshots pre-merge.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # Pull every non-meta universe's snapshot directory into the workspace
      # so the aggregator can read results/demo/<u>/index.json + latest.json.
      # Each `git checkout origin/data -- ...` is non-fatal so a fresh repo
      # (universe absent from data branch) still progresses.
      - name: Pull demo snapshots from data branch
        run: |
          set -euo pipefail
          git fetch origin data
          for u in qte77-watchlist sp500 eurostoxx federal-contractors japan south-america south-korea; do
            git checkout origin/data -- "results/demo/$u/" 2>/dev/null \
              || echo "No demo dir for $u on data branch; skipping leg."
          done

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install runtime dependencies
        run: uv sync

      - name: Build aggregated-scores-best-and-worst preset + audit
        run: uv run python scripts/build_aggregated_scores_best_and_worst.py

      - name: Detect preset diff + audit path
        id: preset
        run: |
          set -euo pipefail
          if git diff --quiet -- src/assets/universes/aggregated-scores-best-and-worst.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          DATE=$(date -u +%Y-%m-%d)
          echo "audit=results/aggregated_scores_best_and_worst/audit/$DATE.json" >> "$GITHUB_OUTPUT"

      - name: Commit audit JSON to data branch as verified commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          AUDIT_PATH: ${{ steps.preset.outputs.audit }}
        with:
          # Reuses scripts/data-branch-commit.cjs for the 422-retry shared
          # with demo-snapshot + federal-contractors-refresh on the `data`
          # branch's concurrent-write race.
          script: |
            const fs = require("fs");
            const { AUDIT_PATH } = process.env;
            if (\!fs.existsSync(AUDIT_PATH)) {
              core.info(`No audit JSON at ${AUDIT_PATH}; skipping`);
              return;
            }
            const { run } = require("./scripts/data-branch-commit.cjs");
            return run({
              github, context, core,
              paths: [AUDIT_PATH],
              message: "chore(universe): weekly aggregated-scores-best-and-worst audit",
            });

      - name: Open preset PR (when diff non-empty)
        if: steps.preset.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          BRANCH="auto/aggregated-scores-best-and-worst-refresh-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add src/assets/universes/aggregated-scores-best-and-worst.txt
          git commit -m "chore(universe): refresh aggregated-scores-best-and-worst preset"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(universe): refresh aggregated-scores-best-and-worst preset" \
            --body "Auto-generated by .github/workflows/aggregated-scores-best-and-worst-refresh.yaml.

          Per-ticker audit JSON committed to the \`data\` branch under
          \`results/aggregated_scores_best_and_worst/audit/\`.

          See ADR-0005 for tier classification (Tier-0, pure aggregation)."
