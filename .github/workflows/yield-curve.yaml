---
# Daily 5s10s yield-curve snapshot (#165).
#
# Runs at 22:30 UTC (~1h after the F&G cron at 21:30 — staggered so
# the two crons don't race on the same `data` branch ref). Fetches the
# latest yfinance ^TNX and ^FVX closes, computes the 10y−5y slope,
# merges into per-year history files at results/series/yield_curve/YYYY.json,
# and commits changed files as a single verified commit via the REST
# Git Data API (Blob -> Tree -> Commit -> Ref).
#
# Same verified-commit pattern as fear-greed.yaml; same data-branch
# rationale (the repo's default-branch ruleset rejects direct ref
# updates on main even from verified API commits — `data` is
# unrestricted).

name: yield-curve-snapshot

on:
  schedule:
    # 22:30 UTC daily — 1h after the F&G cron so they don't race the
    # same data-branch ref
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yield-curve-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: fetch + commit yield-curve snapshot
    runs-on: ubuntu-latest
    steps:
      # Check out the workflow ref (main on cron + dispatch from main)
      # for the current src/ layout — `src.data_sources.yield_curve`
      # lives on main only. The `data` branch carries data only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Pull the accumulated yield-curve history from the data branch
      # so yield_curve.py merges into it rather than starting fresh.
      # Path-scoped checkout touches only results/series/yield_curve/.
      - name: Fetch existing yield-curve history from data branch
        run: |
          set -euo pipefail
          git fetch origin data --depth=1
          rm -rf results/series/yield_curve
          git checkout origin/data -- results/series/yield_curve/ || \
            echo "no existing results/series/yield_curve/ on data — first run"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install runtime dependencies
        run: uv sync

      - name: Fetch yield-curve snapshot
        run: uv run python -m analyze_stock_kpi.data_sources.yield_curve

      - name: Detect changed history files
        id: changed
        run: |
          set -euo pipefail
          # -uall enumerates files inside untracked directories — without
          # it the first run (no prior results/series/yield_curve/ on data
          # branch) shows "?? results/series/yield_curve/" summarised and awk
          # finds nothing, silently skipping the commit.
          FILES=$(git status --porcelain -uall results/series/yield_curve/ \
            | awk '$2 ~ /^results\/series\/yield_curve\/[0-9]{4}\.json$/ {print $2}' \
            | paste -sd ',' -)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          if [ -z "$FILES" ]; then
            echo "no yield-curve history changes; skipping commit"
          else
            echo "changed: $FILES"
          fi

      - name: Commit history file(s) as a single verified commit
        if: steps.changed.outputs.files != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          FILES: ${{ steps.changed.outputs.files }}
        with:
          # Retry-aware verified-commit lives in scripts/data-branch-commit.cjs
          # so it is reused across every data-branch-writing workflow and
          # survives the 422 race the matrix legs occasionally hit.
          script: |
            const { FILES } = process.env;
            const paths = FILES.split(',').filter(Boolean);
            const { run } = require("./scripts/data-branch-commit.cjs");
            return run({
              github, context, core,
              paths,
              message: 'chore(yield-curve): daily 5s10s yield-curve snapshot',
            });
