---
# Weekly fundamentals snapshot for the demo dashboard (#59, #130).
#
# Runs Sundays at 06:15 UTC (staggers from sbom 00:00 Sun). Fans out
# across every bundled universe in src/analyze_stock_kpi/assets/universes/*.txt as
# independent matrix legs (fail-fast: false). Each leg fetches its
# universe via `make run`, renames the timestamped output to
# results/demo/<UNIVERSE>/<YYYY-MM-DD>.json, rebuilds the manifest,
# and commits both files as a single verified commit via the REST Git
# Data API (Blob -> Tree -> Commit -> Ref).
#
# `workflow_dispatch` still accepts a `universe` input; when set, the
# matrix collapses to that single universe so ad-hoc dispatch stays
# cheap. Unset (scheduled or dispatched without input) reads
# `ui/public/universes.json` (the dashboard picker's source of truth)
# and fans out across every universe the dashboard knows about —
# regardless of whether the preset .txt exists or is empty. Adding a
# new universe is a single edit to that JSON. The dispatch dropdown
# still lists choices explicitly because `type: choice` requires
# static options.
#
# Target branch is `data` (not `main`). The repo's default-branch
# ruleset (id 16200383) has a `pull_request` rule that rejects direct
# ref updates on `main` even from verified API commits. The ruleset
# scope is `~DEFAULT_BRANCH` only, so a `data` branch is unrestricted
# and accepts verified-commit pushes. The static dashboard fetches
# data files from raw.githubusercontent.com on the `data` branch.
#
# 1p citation for the verified-commit mechanism:
# https://github.com/iarekylew00t/verified-bot-commit (README)

name: demo-snapshot

on:
  schedule:
    # 06:15 UTC every Sunday (staggers from sbom 00:00 Sun)
    - cron: "15 6 * * 0"
  workflow_dispatch:
    inputs:
      universe:
        description: "Single universe (omit for full 11-universe fan-out)"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - qte77-watchlist
          - sp500
          - eurostoxx
          - federal-contractors
          - japan
          - south-america
          - south-korea
          - aggregated-scores-best
          - aggregated-scores-worst
          - enhanced-kpi-screener-longs
          - enhanced-kpi-screener-shorts

permissions:
  contents: write

concurrency:
  group: demo-snapshot
  cancel-in-progress: false

jobs:
  # Compute the matrix of universes once. Cron + dispatch-without-input
  # discover every preset from src/analyze_stock_kpi/assets/universes/*.txt so adding a
  # new universe is a one-file change (drop the .txt — workflow inherits).
  # Dispatch with `universe` set collapses to a single leg so ad-hoc
  # debug runs stay cheap.
  matrix:
    name: build matrix
    runs-on: ubuntu-latest
    outputs:
      universes: ${{ steps.compute.outputs.universes }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          sparse-checkout: ui/public/universes.json
          sparse-checkout-cone-mode: false
      - id: compute
        env:
          INPUT_UNIVERSE: ${{ inputs.universe }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_UNIVERSE" ]]; then
            # `type: choice` already constrains the value to a known
            # preset name; quoting is safe.
            echo "universes=[\"$INPUT_UNIVERSE\"]" >> "$GITHUB_OUTPUT"
          else
            # Source of truth: ui/public/universes.json — every universe
            # the dashboard picker can show. (Re-)build all of them
            # regardless of whether the underlying preset .txt exists,
            # is missing, or is empty; emitting a zero-row snapshot
            # for an unpopulated universe is the right rebuild
            # behaviour. The preset itself is the orchestrator's
            # contract (universe-builder.yaml), not demo-snapshot's.
            UNIVERSES=$(jq -c '[.universes[].id]' ui/public/universes.json)
            echo "universes=$UNIVERSES" >> "$GITHUB_OUTPUT"
          fi

  snapshot:
    needs: matrix
    name: snapshot ${{ matrix.universe }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        universe: ${{ fromJSON(needs.matrix.outputs.universes) }}
    steps:
      # Check out the dispatched ref (cron + dispatch-without-input both
      # default to the workflow's home branch, which is `main`). Lets a
      # `gh workflow run --ref feat/foo` exercise feat-branch workflow +
      # helper changes against real `data`-branch concurrency before merge.
      # The `data` branch is reached only via explicit `git fetch origin
      # data` further down; the initial checkout never points at `data`.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # Bring the data branch's accumulated snapshot directory into the
      # workspace so build_demo_manifest.py sees existing dated files
      # alongside the new one. Failure is non-fatal (first-ever run on
      # a fresh universe has nothing to pull).
      - name: Sparse-pull existing snapshots from data branch
        env:
          UNIVERSE: ${{ matrix.universe }}
        run: |
          set -euo pipefail
          git fetch origin data
          git checkout origin/data -- "results/demo/$UNIVERSE/" 2>/dev/null || \
            echo "No existing demo dir for $UNIVERSE on data branch — first run."

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install runtime dependencies
        run: uv sync

      - name: Run KPI snapshot
        env:
          UNIVERSE: ${{ matrix.universe }}
          # Optional SEC EDGAR UA — same pattern as federal-contractors-refresh.
          # `make run` invokes `python -m analyze_stock_kpi` which calls enrich_snapshot_sec.
          SSK_SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: make run UNIVERSE="$UNIVERSE"

      - name: Move output + rebuild manifest
        id: prep
        env:
          UNIVERSE: ${{ matrix.universe }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          DEST="results/demo/$UNIVERSE"
          mkdir -p "$DEST"
          mv results/fundamentals/*.json "$DEST/$DATE.json"
          uv run python scripts/build_demo_manifest.py "$DEST"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "snapshot=$DEST/$DATE.json" >> "$GITHUB_OUTPUT"
          echo "manifest=$DEST/index.json" >> "$GITHUB_OUTPUT"

      - name: Commit snapshot + manifest as a single verified commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          UNIVERSE: ${{ matrix.universe }}
          SNAPSHOT_PATH: ${{ steps.prep.outputs.snapshot }}
          MANIFEST_PATH: ${{ steps.prep.outputs.manifest }}
        with:
          # Retry-aware verified-commit lives in scripts/data-branch-commit.cjs
          # so it is reused by federal-contractors-refresh and survives the
          # concurrent-matrix race on the `data` ref (422 Reference cannot
          # be updated when N legs target the same parent SHA).
          script: |
            const { UNIVERSE, SNAPSHOT_PATH, MANIFEST_PATH } = process.env;
            const { run } = require("./scripts/data-branch-commit.cjs");
            return run({
              github, context, core,
              paths: [SNAPSHOT_PATH, MANIFEST_PATH],
              message: `chore(demo): weekly snapshot ${UNIVERSE}`,
            });
