---
# Weekly fundamentals snapshot for the demo dashboard (#59, #130).
#
# Runs Sundays at 06:15 UTC (staggers from sbom 00:00 Sun). Fans out
# across every bundled universe in src/assets/universes/*.txt as
# independent matrix legs (fail-fast: false). Each leg fetches its
# universe via `make run`, renames the timestamped output to
# results/demo/<UNIVERSE>/<YYYY-MM-DD>.json, rebuilds the manifest,
# and commits both files as a single verified commit via the REST Git
# Data API (Blob -> Tree -> Commit -> Ref).
#
# `workflow_dispatch` still accepts a `universe` input; when set, the
# matrix collapses to that single universe so ad-hoc dispatch stays
# cheap. Unset (scheduled or dispatched without input) runs the full
# 8-universe fan-out.
#
# Target branch is `data` (not `main`). The repo's default-branch
# ruleset (id 16200383) has a `pull_request` rule that rejects direct
# ref updates on `main` even from verified API commits. The ruleset
# scope is `~DEFAULT_BRANCH` only, so a `data` branch is unrestricted
# and accepts verified-commit pushes. The static dashboard fetches
# data files from raw.githubusercontent.com on the `data` branch.
#
# 1p citation for the verified-commit mechanism:
# https://github.com/iarekylew00t/verified-bot-commit (README)

name: demo-snapshot

on:
  schedule:
    # 06:15 UTC every Sunday (staggers from sbom 00:00 Sun)
    - cron: "15 6 * * 0"
  workflow_dispatch:
    inputs:
      universe:
        description: "Single universe (omit for full 8-universe fan-out)"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - qte77-watchlist
          - sp500
          - eurostoxx
          - federal-contractors
          - japan
          - south-america
          - south-korea
          - crypto-top10

permissions:
  contents: write

concurrency:
  group: demo-snapshot
  cancel-in-progress: false

jobs:
  # Compute the matrix of universes once. Cron + dispatch-without-input
  # fan out across all 8 bundled presets; dispatch with `universe` set
  # collapses to a single leg so ad-hoc debug runs stay cheap.
  matrix:
    name: build matrix
    runs-on: ubuntu-latest
    outputs:
      universes: ${{ steps.compute.outputs.universes }}
    steps:
      - id: compute
        env:
          INPUT_UNIVERSE: ${{ inputs.universe }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_UNIVERSE" ]]; then
            # `type: choice` already constrains the value to a known
            # preset name; quoting is safe.
            echo "universes=[\"$INPUT_UNIVERSE\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'universes=["qte77-watchlist","sp500","eurostoxx","federal-contractors","japan","south-america","south-korea","crypto-top10"]' >> "$GITHUB_OUTPUT"
          fi

  snapshot:
    needs: matrix
    name: snapshot ${{ matrix.universe }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        universe: ${{ fromJSON(needs.matrix.outputs.universes) }}
    steps:
      # Check out `main` for the latest source code (model schema, fetchers,
      # composite-score logic). The `data` branch holds only accumulated
      # snapshot files and lags `main`'s code arbitrarily — running off
      # `data` produces stale-schema snapshots.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      # Bring the data branch's accumulated snapshot directory into the
      # workspace so build_demo_manifest.py sees existing dated files
      # alongside the new one. Failure is non-fatal (first-ever run on
      # a fresh universe has nothing to pull).
      - name: Sparse-pull existing snapshots from data branch
        env:
          UNIVERSE: ${{ matrix.universe }}
        run: |
          set -euo pipefail
          git fetch origin data
          git checkout origin/data -- "results/demo/$UNIVERSE/" 2>/dev/null || \
            echo "No existing demo dir for $UNIVERSE on data branch — first run."

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install runtime dependencies
        run: uv sync

      - name: Run KPI snapshot
        env:
          UNIVERSE: ${{ matrix.universe }}
          # Optional SEC EDGAR UA — same pattern as federal-contractors-refresh.
          # `make run` invokes `python -m src` which calls enrich_snapshot_sec.
          SSK_SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: make run UNIVERSE="$UNIVERSE"

      - name: Move output + rebuild manifest
        id: prep
        env:
          UNIVERSE: ${{ matrix.universe }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          DEST="results/demo/$UNIVERSE"
          mkdir -p "$DEST"
          mv results/fundamentals/*.json "$DEST/$DATE.json"
          uv run python scripts/build_demo_manifest.py "$DEST"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "snapshot=$DEST/$DATE.json" >> "$GITHUB_OUTPUT"
          echo "manifest=$DEST/index.json" >> "$GITHUB_OUTPUT"

      - name: Commit snapshot + manifest as a single verified commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          UNIVERSE: ${{ matrix.universe }}
          SNAPSHOT_PATH: ${{ steps.prep.outputs.snapshot }}
          MANIFEST_PATH: ${{ steps.prep.outputs.manifest }}
        with:
          # All N matrix legs target the same `data` ref concurrently. The
          # updateRef call fails with 422 ("Reference cannot be updated")
          # when another leg's commit landed between our getRef and our
          # updateRef. We retry by re-fetching the parent and rebuilding
          # the tree (blobs themselves are content-addressed, so they
          # persist across retries). Backoff has a small jitter so 8
          # concurrent legs spread their retries rather than colliding
          # again on the same tick.
          script: |
            const fs = require('fs');
            const { UNIVERSE, SNAPSHOT_PATH, MANIFEST_PATH } = process.env;
            const { owner, repo } = context.repo;
            const branch = 'data';
            const MAX_ATTEMPTS = 8;

            const mkBlob = async (path) => {
              const content = fs.readFileSync(path).toString('base64');
              const blob = await github.rest.git.createBlob({
                owner, repo, content, encoding: 'base64',
              });
              return { path, mode: '100644', type: 'blob', sha: blob.data.sha };
            };
            const tree = [
              await mkBlob(SNAPSHOT_PATH),
              await mkBlob(MANIFEST_PATH),
            ];

            for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
              try {
                const ref = await github.rest.git.getRef({
                  owner, repo, ref: `heads/${branch}`,
                });
                const parentSha = ref.data.object.sha;
                const parentCommit = await github.rest.git.getCommit({
                  owner, repo, commit_sha: parentSha,
                });
                const newTree = await github.rest.git.createTree({
                  owner, repo, base_tree: parentCommit.data.tree.sha, tree,
                });
                const commit = await github.rest.git.createCommit({
                  owner, repo,
                  message: `chore(demo): weekly snapshot ${UNIVERSE}`,
                  tree: newTree.data.sha,
                  parents: [parentSha],
                });
                await github.rest.git.updateRef({
                  owner, repo, ref: `heads/${branch}`, sha: commit.data.sha,
                });
                core.info(
                  `Created verified commit ${commit.data.sha.slice(0, 8)} ` +
                  `on ${branch} (attempt ${attempt}/${MAX_ATTEMPTS})`,
                );
                return;
              } catch (err) {
                const racy = err.status === 422 && attempt < MAX_ATTEMPTS;
                if (!racy) throw err;
                const backoff = 500 * attempt + Math.floor(Math.random() * 500);
                core.info(
                  `Ref update lost race (attempt ${attempt}/${MAX_ATTEMPTS}); ` +
                  `retrying in ${backoff}ms`,
                );
                await new Promise((r) => setTimeout(r, backoff));
              }
            }
