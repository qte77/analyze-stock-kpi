---
name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: lint + types + complexity + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dev + test dependencies
        run: uv sync --group dev --group test

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright type check
        run: uv run pyright src

      - name: Complexipy cognitive complexity (max 10)
        run: uv run complexipy src --max-complexity-allowed 10

      - name: Install JS dev dependencies
        working-directory: ui
        run: npm install --no-audit --no-fund

      - name: Lint JS (node --check + tsc JSDoc + ESLint + Prettier)
        working-directory: ui
        run: |
          node --check app.js
          npm run typecheck
          npm run lint
          npm run format:check

      - name: Vitest (demo unit tests)
        working-directory: ui
        run: npm test

      - name: Build UI (Vite)
        working-directory: ui
        run: npm run build

      - name: Pytest with coverage
        run: make test_cov
