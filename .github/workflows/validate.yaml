---
name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: lint + types + complexity + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dev + test dependencies
        run: uv sync --group dev --group test

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright type check
        run: uv run pyright src

      - name: Complexipy cognitive complexity (max 10)
        run: uv run complexipy src --max-complexity-allowed 10

      - name: Install JS dev dependencies
        working-directory: ui
        run: npm install --no-audit --no-fund

      - name: Lint JS (node --check + tsc JSDoc + ESLint + Prettier)
        working-directory: ui
        run: |
          node --check app.js
          npm run typecheck
          npm run lint
          npm run format:check

      - name: Vitest (demo unit tests)
        working-directory: ui
        run: npm test

      - name: Build UI (Vite)
        working-directory: ui
        run: npm run build

      - name: Pytest with coverage
        run: make test_cov
