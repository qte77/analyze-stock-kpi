---
name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: lint + types + complexity + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dev + test dependencies
        run: uv sync --group dev --group test

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright type check
        run: uv run pyright src

      - name: Complexipy cognitive complexity (max 10)
        run: uv run complexipy src --max-complexity-allowed 10

      - name: Markdownlint
        run: |
          npx --yes markdownlint-cli --config .markdownlint.json '**/*.md' \
            --ignore '.venv/**' --ignore 'results/**' --ignore 'node_modules/**' \
            --ignore 'changelog.d/**'

      - name: Install JS dev dependencies
        run: npm install --no-audit --no-fund

      - name: Lint JS (node --check + tsc JSDoc + ESLint + Prettier)
        run: |
          node --check ui/app.js
          npx --yes -p typescript@5 tsc --noEmit --project ui
          npm run lint
          npm run format:check

      - name: Vitest (demo unit tests)
        run: npm test

      - name: Pytest with coverage
        run: make test_cov
