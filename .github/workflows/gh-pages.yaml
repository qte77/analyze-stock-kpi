---
# Demo dashboard deploy to GitHub Pages (#59).
#
# Modern Pages source = "GitHub Actions" (Settings -> Pages -> Source).
# Workflow builds ui/ with Vite (npm run build → ui/dist) and deploys it
# via actions/upload-pages-artifact + actions/deploy-pages (ADR-0010). No
# gh-pages branch.
#
# Data files (results/series/cnn_fg/YYYY.json, results/demo/<UNIVERSE>/*.json)
# are NOT bundled into the artifact. The page fetches them at runtime
# from raw.githubusercontent.com on the `data` branch, where the
# fear-greed.yaml and demo-snapshot.yml workflows commit verified
# updates. This decouples data-update cadence from page deploys —
# this workflow runs only when ui/* or this workflow itself
# changes.

name: gh-pages

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/gh-pages.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: build + deploy ui to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Build the UI (Vite)
        working-directory: ui
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ui/dist

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
