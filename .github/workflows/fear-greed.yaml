---
# Daily CNN Fear & Greed snapshot.
#
# Runs at 21:30 UTC (~30 min after NYSE 16:00 ET close, year-round).
# Fetches the live CNN F&G headline + ~1y of historical readings, merges
# into per-year history files at results/cnn_fg/YYYY.json, and commits
# changed files as a single verified commit via the REST Git Data API
# (Blob -> Tree -> Commit -> Ref).
#
# Target branch is `data` (not `main`). The repo's default-branch
# ruleset (id 16200383) has a `pull_request` rule that rejects direct
# ref updates on `main` even from verified API commits. The ruleset
# scope is `~DEFAULT_BRANCH` only, so a `data` branch is unrestricted
# and accepts verified-commit pushes. The static dashboard fetches
# data files from raw.githubusercontent.com on the `data` branch.
#
# 1p citation for the verified-commit mechanism:
# https://github.com/iarekylew00t/verified-bot-commit (README)

name: fear-greed-snapshot

on:
  schedule:
    # 21:30 UTC daily (~30 min after NYSE 16:00 ET close, year-round)
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fear-greed-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: fetch + commit CNN F&G snapshot
    runs-on: ubuntu-latest
    steps:
      # Check out the workflow ref (main on cron + dispatch from main) for
      # the current `src/` layout — `src.data_sources.sentiment` lives in
      # the post-restructure tree on main only. The `data` branch still
      # carries the pre-restructure flat layout (`src.sentiment`) because
      # it's a data-only branch that never re-syncs source. Older code
      # used `ref: data` here, which broke on `python -m
      # src.data_sources.sentiment` with `ModuleNotFoundError`.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      # Pull the accumulated F&G history from the data branch into the
      # local checkout so sentiment.py merges into it rather than starting
      # from main's older snapshot. Path-scoped `git checkout` touches
      # only results/cnn_fg/; nothing else from data leaks into the
      # workspace (we don't want data's stale src/).
      - name: Fetch existing F&G history from data branch
        run: |
          set -euo pipefail
          git fetch origin data --depth=1
          rm -rf results/cnn_fg
          git checkout origin/data -- results/cnn_fg/

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install runtime dependencies
        run: uv sync

      - name: Fetch Fear & Greed snapshot
        run: uv run python -m analyze_stock_kpi.data_sources.sentiment

      - name: Detect changed history files
        id: changed
        run: |
          set -euo pipefail
          # -uall so files inside an untracked results/cnn_fg/ get
          # enumerated (defensive — relevant on a fresh repo / first run).
          FILES=$(git status --porcelain -uall results/cnn_fg/ \
            | awk '$2 ~ /^results\/cnn_fg\/[0-9]{4}\.json$/ {print $2}' \
            | paste -sd ',' -)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          if [ -z "$FILES" ]; then
            echo "no F&G history changes; skipping commit"
          else
            echo "changed: $FILES"
          fi

      - name: Commit history file(s) as a single verified commit
        if: steps.changed.outputs.files != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          FILES: ${{ steps.changed.outputs.files }}
        with:
          # Retry-aware verified-commit lives in scripts/data-branch-commit.cjs
          # so it is reused across every data-branch-writing workflow and
          # survives the 422 race the matrix legs occasionally hit.
          script: |
            const { FILES } = process.env;
            const paths = FILES.split(',').filter(Boolean);
            const { run } = require("./scripts/data-branch-commit.cjs");
            return run({
              github, context, core,
              paths,
              message: 'chore(sentiment): daily CNN Fear & Greed snapshot',
            });
