---
# CodeQL static security analysis. Scans Python (`src/`) and JavaScript
# (`docs/demo/app.js`). Vendored minified libs under `docs/demo/vendor/`
# are excluded via the inline `config:` block on the init step below.
# https://docs.github.com/en/code-security/code-scanning
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 11 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9e0d7b8d25671d64c341c19c0152d693099fb5ba  # v4
        with:
          languages: ${{ matrix.language }}
          # Vendored Chart.js + Fuse.js are minified third-party bundles
          # — exclude them so we don't analyze code we don't own.
          config: |
            paths-ignore:
              - "docs/demo/vendor/**"

      - name: Autobuild
        uses: github/codeql-action/autobuild@9e0d7b8d25671d64c341c19c0152d693099fb5ba  # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9e0d7b8d25671d64c341c19c0152d693099fb5ba  # v4
        with:
          # Pin SARIF uploads to the PR head SHA (stable) rather than
          # the merge-ref SHA (recomputed every push). The merge
          # protection check is keyed against the head SHA or the
          # then-current merge SHA; uploads against the moving merge
          # ref were racing the check — once main moved, the required
          # result wasn't found and the merge stalled with `Code
          # scanning is still expecting 1 result from CodeQL`.
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
