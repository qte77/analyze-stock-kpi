---
# CodeQL static security analysis. Scans Python (`src/`) and JavaScript
# (`ui/app.js`). Vendored minified libs under `ui/vendor/`
# are excluded via the inline `config:` block on the init step below.
# https://docs.github.com/en/code-security/code-scanning
name: CodeQL

on:
  # No branch filter so feature-branch pushes are also scanned. The
  # `pull_request` trigger is intentionally absent: under it, SARIFs
  # upload against the volatile merge-ref SHA which races GitHub's
  # merge-protection check ("Code scanning is still expecting 1 result
  # from CodeQL for <merge-sha> or <head-sha>"). Push-only matches the
  # qte77/Agents-eval + qte77/doc-pipeline-engine convention.
  push:
  schedule:
    - cron: "27 11 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4
        with:
          languages: ${{ matrix.language }}
          # Vendored Chart.js + Fuse.js are minified third-party bundles
          # — exclude them so we don't analyze code we don't own.
          config: |
            paths-ignore:
              - "ui/public/vendor/**"

      - name: Autobuild
        uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4
        with:
          output: sarif-results

      # Lets inline noqa-style comments dismiss alerts at scan time —
      # matches qte77/Agents-eval + doc-pipeline-engine.
      - name: Dismiss alerts with inline suppression comments
        uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8  # v2.0.3
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
