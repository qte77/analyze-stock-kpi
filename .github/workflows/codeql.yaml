---
# CodeQL static security analysis. Scans Python (`src/`) and JavaScript
# (`docs/demo/app.js`). Vendored minified libs under `docs/demo/vendor/`
# are excluded via the inline `config:` block on the init step below.
# https://docs.github.com/en/code-security/code-scanning
name: CodeQL

on:
  # No branch filter so feature-branch pushes are also scanned. The
  # `pull_request` trigger is intentionally absent: under it, SARIFs
  # upload against the volatile merge-ref SHA which races GitHub's
  # merge-protection check ("Code scanning is still expecting 1 result
  # from CodeQL for <merge-sha> or <head-sha>"). Push-only matches the
  # qte77/Agents-eval + qte77/doc-pipeline-engine convention.
  push:
  schedule:
    - cron: "27 11 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4
        with:
          languages: ${{ matrix.language }}
          # Vendored Chart.js + Fuse.js are minified third-party bundles
          # — exclude them so we don't analyze code we don't own.
          config: |
            paths-ignore:
              - "docs/demo/vendor/**"

      - name: Autobuild
        uses: github/codeql-action/autobuild@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4
        with:
          output: sarif-results

      # Lets inline noqa-style comments dismiss alerts at scan time —
      # matches qte77/Agents-eval + doc-pipeline-engine.
      - name: Dismiss alerts with inline suppression comments
        uses: advanced-security/dismiss-alerts@046d6b48d2e43cf563f96f67332c47c432eff83e  # v2.0.2
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
