---
# Weekly refresh of the federal-contractors universe preset.
#
# Sundays at 04:00 UTC (2h before demo-snapshot.yaml). Calls the
# library orchestrator via scripts/build_federal_contractors.py,
# commits the audit JSON to the `data` branch via the verified REST
# Git Data API pattern, and opens a PR against `main` via the gh CLI
# IFF the preset diff is non-empty. Pattern mirrors
# qte77/gha-sbom-action — no third-party PR-creation actions, no
# extra SHA-pin surface.

name: federal-contractors-refresh

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: federal-contractors-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: rebuild preset + commit audit + open preset PR
    runs-on: ubuntu-latest
    steps:
      # Check out the dispatched ref. Cron + dispatch-without-input default
      # to the workflow's home branch (main); explicit `gh workflow run
      # --ref feat/foo` validates feat-branch helper changes pre-merge.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install runtime dependencies
        run: uv sync

      - name: Build federal-contractors preset + audit
        env:
          # Optional SEC EDGAR User-Agent override. Set repo variable
          # SEC_USER_AGENT to the operator contact (e.g.,
          # "Name email@example.com"); unset -> expands to '' which
          # AppSettings ignores (env_ignore_empty=True) so the
          # in-source identity-shape placeholder default ships.
          # Not a secret — UA is sent in plaintext to SEC.
          # See ADR-0006 amendment 2026-05-22 (later).
          SSK_SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: uv run python scripts/build_federal_contractors.py

      - name: Detect preset diff + audit path
        id: preset
        run: |
          set -euo pipefail
          if git diff --quiet -- src/assets/universes/federal-contractors.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          DATE=$(date -u +%Y-%m-%d)
          echo "audit=results/federal_contractors/audit/$DATE.json" >> "$GITHUB_OUTPUT"

      - name: Commit audit JSON to data branch as verified commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          AUDIT_PATH: ${{ steps.preset.outputs.audit }}
        with:
          # Routes through scripts/data-branch-commit.cjs so this workflow
          # benefits from the same 422-retry as demo-snapshot's matrix —
          # both workflows race on the `data` ref when they run on
          # overlapping schedules.
          script: |
            const fs = require("fs");
            const { AUDIT_PATH } = process.env;
            if (!fs.existsSync(AUDIT_PATH)) {
              core.info(`No audit JSON at ${AUDIT_PATH}; skipping`);
              return;
            }
            const { run } = require("./scripts/data-branch-commit.cjs");
            return run({
              github, context, core,
              paths: [AUDIT_PATH],
              message: "chore(universe): weekly federal-contractors audit",
            });

      - name: Open preset PR (when diff non-empty)
        if: steps.preset.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          BRANCH="auto/federal-contractors-refresh-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add src/assets/universes/federal-contractors.txt
          git commit -m "chore(universe): refresh federal-contractors preset"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(universe): refresh federal-contractors preset" \
            --body "Auto-generated by .github/workflows/federal-contractors-refresh.yaml.

          Per-recipient audit JSON committed to the \`data\` branch under
          \`results/federal_contractors/audit/\`."
