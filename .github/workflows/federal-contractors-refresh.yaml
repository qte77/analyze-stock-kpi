---
# Weekly refresh of the federal-contractors universe preset.
#
# Sundays at 04:00 UTC (2h before demo-snapshot.yaml). Calls the
# library orchestrator via scripts/build_federal_contractors.py,
# commits the audit JSON to the `data` branch via the verified REST
# Git Data API pattern, and opens a PR against `main` IFF the preset
# diff is non-empty.
#
# FIXME: pre-cron-enable checklist (manual repo-settings work):
#   * Add `peter-evans/create-pull-request` to the repo's "Allowed
#     actions and reusable workflows" list (Settings -> Actions ->
#     General). actions/checkout, astral-sh/setup-uv, and
#     actions/github-script are already used by sibling workflows.
#   * Confirm the default-branch ruleset (id 16200383) accepts the
#     PR opened by the auto/federal-contractors-refresh branch under
#     the existing pull_request gate (no admin bypass needed; review
#     happens before merge).
#   * The `data` branch is unprotected and accepts verified API
#     commits per the precedent in fear-greed.yaml / demo-snapshot.yaml.

name: federal-contractors-refresh

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: federal-contractors-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: rebuild preset + commit audit + open preset PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install runtime dependencies
        run: uv sync

      - name: Build federal-contractors preset + audit
        run: uv run python scripts/build_federal_contractors.py

      - name: Detect preset diff + audit path
        id: preset
        run: |
          set -euo pipefail
          if git diff --quiet -- src/assets/universes/federal-contractors.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          DATE=$(date -u +%Y-%m-%d)
          echo "audit=results/federal_contractors/audit/$DATE.json" >> "$GITHUB_OUTPUT"

      - name: Commit audit JSON to data branch as verified commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          AUDIT_PATH: ${{ steps.preset.outputs.audit }}
        with:
          script: |
            const fs = require('fs');
            const { AUDIT_PATH } = process.env;
            const { owner, repo } = context.repo;
            const branch = 'data';

            if (!fs.existsSync(AUDIT_PATH)) {
              core.info(`No audit JSON at ${AUDIT_PATH}; skipping`);
              return;
            }

            const ref = await github.rest.git.getRef({
              owner, repo, ref: `heads/${branch}`,
            });
            const parentSha = ref.data.object.sha;
            const parentCommit = await github.rest.git.getCommit({
              owner, repo, commit_sha: parentSha,
            });

            const blob = await github.rest.git.createBlob({
              owner, repo,
              content: fs.readFileSync(AUDIT_PATH).toString('base64'),
              encoding: 'base64',
            });

            const newTree = await github.rest.git.createTree({
              owner, repo,
              base_tree: parentCommit.data.tree.sha,
              tree: [{
                path: AUDIT_PATH,
                mode: '100644',
                type: 'blob',
                sha: blob.data.sha,
              }],
            });

            const commit = await github.rest.git.createCommit({
              owner, repo,
              message: 'chore(universe): weekly federal-contractors audit',
              tree: newTree.data.sha,
              parents: [parentSha],
            });

            await github.rest.git.updateRef({
              owner, repo, ref: `heads/${branch}`, sha: commit.data.sha,
            });

            core.info(`Audit committed as ${commit.data.sha.slice(0, 8)} on ${branch}`);

      - name: Open preset PR (when diff non-empty)
        if: steps.preset.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e  # v7.0.8
        with:
          commit-message: "chore(universe): refresh federal-contractors preset"
          branch: auto/federal-contractors-refresh
          title: "chore(universe): refresh federal-contractors preset"
          body: |
            Auto-generated by `.github/workflows/federal-contractors-refresh.yaml`.

            Per-recipient audit JSON committed to the `data` branch under
            `results/federal_contractors/audit/`.
          add-paths: src/assets/universes/federal-contractors.txt
