name: Publish Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (defaults to the latest v* tag)"
        required: false
        type: string
jobs:
  publish:
    permissions:
      contents: write
    uses: qte77/.github/.github/workflows/publish-release.yml@aeef158fdd62a865aecd03571eaecbe3aa8169e4  # v0.1.2
    with:
      tag: ${{ inputs.tag }}
