name: Publish Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (defaults to the latest v* tag)"
        required: false
        type: string
jobs:
  publish:
    permissions:
      contents: write
    uses: qte77/.github/.github/workflows/publish-release.yml@5ab0cecea3fee43a9c8f5858f7970a088313115e
    with:
      tag: ${{ inputs.tag }}
