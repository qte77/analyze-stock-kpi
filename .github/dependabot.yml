---
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Two ecosystems:
# - "uv" parses pyproject.toml + uv.lock (the previous "pip" entry was a
#   no-op for this repo since dependabot's pip ecosystem looks for
#   requirements.txt-style files, not the uv-managed pyproject layout).
# - "github-actions" keeps the SHA-pinned action references in
#   .github/workflows/ up to date with new tags. Repo rule requires
#   full commit SHA pins, which dependabot will keep current.
#
# Each ecosystem has two groups: the routine version-update bucket
# (weekly, default `applies-to: version-updates`) and a dedicated
# security-update bucket (`applies-to: security-updates`, undefined
# defaults to version-updates only — so security fixes need their own
# group to land grouped instead of one PR per alert).
#
# Complements sbom.yaml (which snapshots the resulting dependency graph
# after updates land — see .github/workflows/sbom.yaml).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-deps:
        applies-to: "version-updates"
        patterns: ["*"]
      python-security:
        applies-to: "security-updates"
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns: ["*"]
      github-actions-security:
        applies-to: "security-updates"
        patterns: ["*"]
...
