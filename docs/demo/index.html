<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>analyze-stock-kpi · demo dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="vendor/chart.umd.min.js" defer></script>
  <script src="vendor/fuse.min.js" defer></script>
  <script src="app.js" type="module"></script>
</head>
<body class="view-simple theme-system">
  <header>
    <h1>
      <a href="https://github.com/qte77/analyze-stock-kpi">analyze-stock-kpi</a>
      · KPI demo dashboard
    </h1>
    <div class="header-meta">
      <div
        id="theme-toggle"
        role="group"
        aria-label="Theme: system, light, or dark"
      >
        <button type="button" data-theme="system" aria-pressed="true" title="Follow system preference">⏿</button>
        <button type="button" data-theme="light" aria-pressed="false" title="Force light theme">☀</button>
        <button type="button" data-theme="dark" aria-pressed="false" title="Force dark theme">🌙</button>
      </div>
      <button
        id="view-toggle"
        type="button"
        aria-label="Toggle simple / detailed view"
      >↗ Detailed</button>
      <span id="updated" class="updated"></span>
    </div>
  </header>

  <main>
    <section id="fear-greed-section">
      <h2>CNN Fear &amp; Greed · Rolling History</h2>
      <div id="fg-header">
        <div id="fg-score">—</div>
        <div id="fg-meta">
          <span id="fg-rating" class="chip">loading…</span>
          <span id="fg-deltas"></span>
        </div>
      </div>
      <div id="fg-chart-wrap">
        <canvas id="fg-chart"></canvas>
      </div>
    </section>

    <section id="universe-section">
      <div id="universe-header">
        <h2>
          Universe ·
          <span id="universe-size">— tickers</span>
        </h2>
        <label>
          Universe:
          <select
            id="universe-picker"
            title="Switch between bundled universes. Chips below appear when the URL deep-links additional universes (?universe=a,b,c) for overlay comparison."
          ></select>
        </label>
        <div
          id="universe-chips"
          class="detail-only"
          aria-label="Active overlay universes; click × to remove"
        ></div>
        <label>
          Snapshot:
          <select id="date-selector"></select>
        </label>
        <input
          id="universe-filter"
          type="search"
          placeholder="Filter ticker / name / sector… (press / to focus)"
          aria-label="Filter universe by ticker, name, or sector"
        />
        <button
          id="export-csv"
          class="detail-only"
          type="button"
          aria-label="Download the current filtered + sorted view as CSV"
        >↓ CSV</button>
      </div>
      <div id="sector-donut-wrap">
        <canvas id="sector-donut" aria-label="Sector composition donut"></canvas>
      </div>
      <div class="table-wrap">
        <table id="universe-table">
          <thead>
            <tr>
              <th data-key="symbol" title="Yahoo Finance symbol">Ticker</th>
              <th data-key="_universe" class="universe-col" title="Source universe (visible only when 2+ universes are overlaid)">Universe</th>
              <th data-key="long_name" title="Long company or asset name">Name</th>
              <th data-key="sector" title="GICS sector (Technology, Healthcare, etc.)">Sector</th>
              <th data-key="forward_pe" class="num detail-only" title="Forward P/E: price / next-12mo EPS estimate. Lower = cheaper relative to expected earnings.">P/E (fwd)</th>
              <th data-key="trailing_peg_ratio" class="num detail-only" title="Trailing PEG ratio: P/E adjusted for historical earnings growth. Lower is better; <1 is the classic Peter Lynch &quot;undervalued&quot; threshold.">PEG</th>
              <th data-key="beta" class="num detail-only" title="5y beta vs market. <1 = less volatile than market; lower = less systematic risk.">Beta</th>
              <th data-key="rd_to_revenue" class="num detail-only" title="R&amp;D expense as share of revenue. EQUITY-only (null for ETFs / FX / futures / crypto).">R&amp;D/Rev %</th>
              <th data-key="operating_margins" class="num" title="Operating margin: operating income / revenue. Pre-tax and pre-interest — comparable across countries.">Op M %</th>
              <th data-key="return_on_equity" class="num detail-only" title="Return on equity: net income / shareholder equity. Profitability per equity dollar (sensitive to leverage).">ROE %</th>
              <th data-key="return_on_assets" class="num detail-only" title="Return on assets: net income / total assets. Leverage-neutral profitability per asset dollar.">ROA %</th>
              <th data-key="current_ratio" class="num detail-only" title="Current ratio: current assets / current liabilities. Short-term liquidity (>1 means assets cover liabilities).">Current</th>
              <th data-key="sortino_ratio" class="num detail-only" title="Annualized Sortino ratio over 1y (rf=0). Higher = better upside vs downside skew.">Sortino</th>
              <th data-key="composite_scores.screener_score" class="num" title="Mean of 4 thematic factor scores — Profitability (>= 2 of 4 inputs) / Valuation (>= 1 of 2) / Risk (>= 1 of 2) / Momentum (1 of 1). Factors below their minimum drop from the composite; remaining factors weigh equally. Requires >= 5 of 9 inputs total or returns —. Higher = better. Default descending.">Score</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <aside id="row-detail" class="detail-only" hidden></aside>
    </section>
  </main>

  <footer>
    Powered by
    <a href="https://github.com/ranaroussi/yfinance">yfinance</a> +
    <a href="https://edition.cnn.com/markets/fear-and-greed">CNN F&amp;G</a>
    · source:
    <a href="https://github.com/qte77/analyze-stock-kpi">qte77/analyze-stock-kpi</a>
  </footer>
</body>
</html>
