[project]
name = "analyze-stock-kpi"
version = "1.1.0"
description = "Analyze stock KPI: per-ticker fundamentals + CNN Fear & Greed sentiment via libraries, no API keys"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "qte77" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "rich>=15.0",
    "tqdm>=4.67",
    "yfinance>=0.2.40",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "pyright>=1.1.400",
    "complexipy>=5.5.0",
    "bump-my-version>=0.29",
    "scriv[toml]>=1.8",
]
test = [
    "pytest>=9.0",
    "pytest-cov>=7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
default-groups = ["dev", "test"]
# Cut-off rolled forward to 2026-05-23 (yesterday UTC) — unblocks
# idna >=3.15 (CVE-2026-45409 ReDoS) and any other security patches
# published between the prior 2026-05-09 cap and now, so future
# Dependabot alerts in this window can be auto-applied without
# requiring another exclude-newer bump.
exclude-newer = "2026-05-23T00:00:00Z"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort (import order)
    "N",    # PEP-8 naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear (likely bugs)
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "PT",   # pytest style
    "ANN",  # flake8-annotations (type hints)
    "TC",   # flake8-type-checking (move imports to TYPE_CHECKING)
    "PGH",  # pygrep-hooks (no broad noqa, etc.)
    "C90",  # mccabe cyclomatic complexity
    "D",    # pydocstyle (docstring style)
    "TRY",  # tryceratops (try/except discipline)
]
ignore = [
    "TRY003",  # long messages outside exception classes — fine for one-off defensive raises
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]   # tests use `assert`; no docstring requirement
"scripts/**" = ["D", "ANN"]  # one-off scripts; over-annotating is noise

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
extraPaths = ["src"]
include = ["src"]
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q --tb=short -m 'not network'"
markers = [
    "network: tests requiring network access (opt in via `pytest -m network`)",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# Atomic version bumping. Single source of truth is [project].version;
# bumpversion keeps the README static badge in sync, tags the release,
# and creates a conventional bump commit. CHANGELOG.md is owned by
# scriv (see [tool.scriv] below) — `make changelog_release VERSION=X`
# runs before bump-my-version at release time.
[tool.bumpversion]
current_version = "1.1.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = true
tag = true
allow_dirty = false
ignore_missing_version = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "v{new_version}"
message = "chore(release): bump {current_version} -> {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "README.md"
search = "version-{current_version}-blue"
replace = "version-{new_version}-blue"

# Changelog fragments — each PR adds one file under changelog.d/ via
# `make changelog_new`, preview the assembled release entry with
# `make changelog_preview`, and `make changelog_release VERSION=X.Y.Z`
# collects fragments into CHANGELOG.md (run before bump-my-version).
# Categories follow Keep a Changelog; only the three currently used
# (Security / Added / Fixed) are listed — extend additively if needed.
[tool.scriv]
format = "md"
fragment_directory = "changelog.d"
categories = ["Security", "Added", "Fixed"]
# Matches the existing CHANGELOG.md convention: `## [X.Y.Z]` entry
# titles, `### Added` category headers. scriv shifts fragment
# headings by (md_header_level + 1) so fragments stay at h3.
md_header_level = "2"
entry_title_template = "[{{ version }}] - {{ date.strftime('%Y-%m-%d') }}"
